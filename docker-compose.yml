services:
  db:
    image: postgres:17-alpine
    container_name: jiraya-postgres
    environment:
      POSTGRES_DB: jiraya
      POSTGRES_USER: jiraya
      POSTGRES_PASSWORD: jiraya_dev_password
    ports:
      - "5432:5432"
    volumes:
      - jiraya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraya -d jiraya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jiraya_pgdata:

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiraya-personal-assistant"
version = "0.5.0"
description = "Evidence-aware Personal AI for the Nebius x NVIDIA Global AI Hackathon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.118.0,<1.0.0",
    "uvicorn[standard]>=0.37.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "cryptography>=46.0.0,<47.0.0",
    "httpx>=0.28.0,<1.0.0",
    "google-api-python-client>=2.150.0,<3.0.0",
    "google-auth>=2.35.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "tzdata>=2025.2",
]

[project.scripts]
jiraya-companion = "app.local_companion.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.13.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "JIRAYA*", "venv*", "env*"]

[tool.setuptools.package-data]
app = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
